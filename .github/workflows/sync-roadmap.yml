name: Sync roadmap metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/milestones.json"
      - ".github/labels.json"
      - "scripts/sync-milestones.sh"
      - ".github/workflows/sync-roadmap.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-roadmap-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels, milestones and issue assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-milestones.sh --repo "${{ github.repository }}" --close-duplicates
