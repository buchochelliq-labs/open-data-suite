name: Packaging

# Checks the pieces release.yml publishes, on pull requests that change them (#212):
# the wheel installs with pip and puts a working `ods` on PATH on Linux, macOS and
# Windows; the licence notices generate; the release scripts pass their self-tests.
# Native debug builds keep it cheap; release.yml builds every target for real.
on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "about.toml"
      - "about.hbs"
      - "deny.toml"
      - "packaging/**"
      - "scripts/changelog-section.py"
      - "scripts/release-*.sh"
      - "rab.yml"
      - ".github/rab/**"
      - "crates/ods-cli/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/rab-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/changelog-section.py --self-test
      # The notes a release of the workspace version would publish: its own section once
      # the release PR has cut it, else what's unreleased. Right after a release,
      # `[Unreleased]` is empty and that's fine.
      - name: The release notes exist
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 scripts/changelog-section.py "$version" > /dev/null || python3 scripts/changelog-section.py Unreleased > /dev/null
      # What rab runs as the GitHub release's notes (rab.yml).
      - name: The release notes script
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if python3 scripts/changelog-section.py "$version" > /dev/null 2>&1; then
            scripts/release-notes.sh "$version" | tee notes.md
            grep -q "pip install opendatasuite==$version" notes.md
          fi
      # The Homebrew formula and the Chocolatey package render as rab renders them
      # for a release (every placeholder filled), from made-up checksums.
      - name: The formula and the Chocolatey package render
        run: |
          python3 -m pip install --quiet pyyaml
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            echo "$(printf '0%.0s' $(seq 64))  ods-v$version-$t.tar.gz"
          done > sums
          echo "$(printf '1%.0s' $(seq 64))  ods-v$version-x86_64-pc-windows-msvc.zip" >> sums
          kit=.github/rab/scripts/release.py
          formula=$(python3 "$kit" render --name ods --channel homebrew --sums sums --out rendered/homebrew)
          ruby -c "$formula"
          python3 "$kit" render --name ods --channel chocolatey --sums sums --out rendered/chocolatey
          python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' rendered/chocolatey/opendatasuite.nuspec
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # What rab runs before every build (rab.yml `prepare`).
      - name: Third-party licence notices
        run: scripts/release-notices.sh

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The steps rab runs for each wheel (rab.yml): the notices, the
      # build, then the wheel's test.
      - name: Third-party licence notices
        shell: bash
        run: scripts/release-notices.sh
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install "maturin==1.15.0"
          maturin build --locked --out wheels
      - name: pip install into a fresh venv, then ods version
        shell: bash
        run: |
          DIST="$PWD/wheels" VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" \
            scripts/release-test-wheel.sh
