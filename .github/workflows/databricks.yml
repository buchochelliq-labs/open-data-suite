# Integration tests against a real Databricks Free Edition workspace (#294).
#
# Runs in the `databricks-free` environment, which holds the workspace settings; fork
# PRs get none of them. Authenticates with workload identity federation (GitHub OIDC,
# no secret) and falls back to the CI service principal's OAuth secret. Set-up and
# local runs: docs/contributing-databricks.md.
#
# Not a required check: Free Edition quotas and warehouse cold starts must not block
# unrelated PRs.
name: databricks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # On a PR, only when someone adds the `databricks` label: one run of the commit they
  # looked at. A pull_request run takes its workflow and scripts from the PR, and gets
  # the environment's credentials, so a later push must never re-run it on its own
  # (no `synchronize`). To test a new commit, remove and re-add the label.
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Free Edition has one 2X-Small warehouse: one run at a time, and never cancel a run
# mid-way, which would leave its schema behind.
concurrency:
  group: databricks-free
  cancel-in-progress: false

jobs:
  smoke:
    # On PRs, only for the `databricks` label just added, and never from forks.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'databricks' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: databricks-free
    permissions:
      contents: read
      id-token: write # workload identity federation
    # Settings are read as variables, or as secrets if stored that way; a secret is
    # masked in the logs, which is fine for these.
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH || secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID || secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DATABRICKS_TOKEN_AUDIENCE || secrets.DATABRICKS_TOKEN_AUDIENCE }}
      DATABRICKS_OAUTH_SCOPES: ${{ vars.DATABRICKS_OAUTH_SCOPES }}
      # The read-only service principal probe checks run under (#392); unset skips them.
      DATABRICKS_PROBE_CLIENT_ID: ${{ vars.DATABRICKS_PROBE_CLIENT_ID || secrets.DATABRICKS_PROBE_CLIENT_ID }}
      CATALOG: ${{ vars.DATABRICKS_CATALOG || secrets.DATABRICKS_CATALOG || 'workspace' }}
      SCHEMA: ods_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      # Everything that runs no Databricks code comes before the token exists.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ods
        run: |
          cargo build -p ods-cli
          echo "ODS=$PWD/target/debug/ods" >> "$GITHUB_ENV"
      - name: Cache the dbt-databricks virtualenv
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/dbt-databricks-venv
          key: dbt-databricks-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.github/dbt/requirements-databricks.txt') }}
      - name: Install dbt-core and dbt-databricks
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/dbt-databricks-venv
          # Exactly the pinned packages: nothing resolved at install time.
          ~/dbt-databricks-venv/bin/pip install --no-deps -r .github/dbt/requirements-databricks.txt
          ~/dbt-databricks-venv/bin/pip check
      - name: Authenticate (federation, else service principal secret)
        env:
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: python .github/databricks/ci.py token
      - name: Identity and warehouse
        run: python .github/databricks/ci.py sql "SELECT current_user() AS who, current_catalog() AS catalog, current_version().dbsql_version AS dbsql"
      - name: Create the run's schema
        run: python .github/databricks/ci.py sql "CREATE SCHEMA \`$CATALOG\`.\`$SCHEMA\` COMMENT 'ODS CI run ${{ github.run_id }}; dropped at the end of the run'"
      - name: Write and read a table
        run: |
          python .github/databricks/ci.py sql "CREATE TABLE \`$CATALOG\`.\`$SCHEMA\`.smoke AS SELECT 1 AS id, 'ok' AS status"
          python .github/databricks/ci.py sql "SELECT * FROM \`$CATALOG\`.\`$SCHEMA\`.smoke"
          python .github/databricks/ci.py sql "DESCRIBE HISTORY \`$CATALOG\`.\`$SCHEMA\`.smoke"
      # `ods state` on the demo project, in the run's schema. Its styled output is also
      # in the log between `ods-transcript` markers, for the docs' screenshots
      # (scripts/render-transcripts.py).
      - name: ods state on the demo project
        run: |
          export PATH="$HOME/dbt-databricks-venv/bin:$PATH"
          # dbt-databricks authenticates with DATABRICKS_TOKEN alone: the Databricks
          # SDK refuses a second method it would find in these.
          unset DATABRICKS_CLIENT_ID DATABRICKS_ACCOUNT_ID DATABRICKS_TOKEN_AUDIENCE DATABRICKS_OAUTH_SCOPES
          ODS_CI_CATALOG="$CATALOG" ODS_CI_SCHEMA="$SCHEMA" bash .github/databricks/demo.sh
      # Delta table versions decide reuse of a model reading a source (ADR-0022, #17),
      # in the demo's project and the run's schema.
      - name: ods state with Delta source versions
        run: |
          export PATH="$HOME/dbt-databricks-venv/bin:$PATH"
          unset DATABRICKS_CLIENT_ID DATABRICKS_ACCOUNT_ID DATABRICKS_TOKEN_AUDIENCE DATABRICKS_OAUTH_SCOPES
          ODS_CI_CATALOG="$CATALOG" ODS_CI_SCHEMA="$SCHEMA" bash .github/databricks/source-versions.sh
      # Probe checks under a read-only login (#392, ADR-0030 §4c, §4e): a second service
      # principal reads the run's schema, which the CI one owns and grants it. Skipped
      # until that principal is set up (docs/contributing-databricks.md).
      - name: Grant the probe service principal read access to the run's schema
        if: env.DATABRICKS_PROBE_CLIENT_ID != ''
        run: python .github/databricks/ci.py sql "GRANT USE SCHEMA, SELECT ON SCHEMA \`$CATALOG\`.\`$SCHEMA\` TO \`$DATABRICKS_PROBE_CLIENT_ID\`"
      - name: Authenticate the probe service principal
        if: env.DATABRICKS_PROBE_CLIENT_ID != ''
        env:
          DATABRICKS_PROBE_CLIENT_SECRET: ${{ secrets.DATABRICKS_PROBE_CLIENT_SECRET }}
        run: python .github/databricks/ci.py token probe
      - name: ods health check under a read-only login
        if: env.DATABRICKS_PROBE_CLIENT_ID != ''
        run: |
          export PATH="$HOME/dbt-databricks-venv/bin:$PATH"
          unset DATABRICKS_CLIENT_ID DATABRICKS_ACCOUNT_ID DATABRICKS_TOKEN_AUDIENCE DATABRICKS_OAUTH_SCOPES
          ODS_CI_CATALOG="$CATALOG" ODS_CI_SCHEMA="$SCHEMA" bash .github/databricks/health-probes.sh
      # Real Databricks messages for the dbt error catalogue's tests (#349), printed
      # between `ods-errors` markers: they become
      # fixtures/dbt/jaffle-ods/artifacts/dbt-databricks-errors/errors.json.
      - name: Capture Databricks error messages
        run: |
          export PATH="$HOME/dbt-databricks-venv/bin:$PATH"
          unset DATABRICKS_CLIENT_ID DATABRICKS_ACCOUNT_ID DATABRICKS_TOKEN_AUDIENCE DATABRICKS_OAUTH_SCOPES
          ODS_CI_CATALOG="$CATALOG" ODS_CI_SCHEMA="$SCHEMA" \
            "$HOME/dbt-databricks-venv/bin/python" .github/databricks/capture-errors.py "$RUNNER_TEMP/databricks-errors.json"
      - name: Drop the run's schema
        if: always() && env.DATABRICKS_TOKEN != ''
        run: python .github/databricks/ci.py sql "DROP SCHEMA IF EXISTS \`$CATALOG\`.\`$SCHEMA\` CASCADE"
