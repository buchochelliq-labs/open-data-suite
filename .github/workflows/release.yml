# Releases ODS (ADR-0019) with release-kit (https://github.com/buchochelliq-labs/release-kit):
# what is published, and where, is release-kit.yml. Everything under .github/release-kit/
# and release-kit-build.yml is the installed kit; this file is ODS's own.
#
# `python3 .github/release-kit/scripts/release.py tag` on main pushes the tags; the
# `release-X.Y.Z` tag starts this run. It checks the tag once, runs CI once on the tagged
# commit, builds the archives and wheels (each tested where its runner can run it), and
# publishes what isn't published yet:
# - the crates on crates.io;
# - the GitHub release on vX.Y.Z: archives, SHA256SUMS, provenance attestations, and
#   the version's CHANGELOG section as notes;
# - the wheels on PyPI;
# - then, from the GitHub release, the Homebrew formula (attached to the release, and a
#   pull request on the tap) and the Chocolatey package.
#
# Admin setup (the crates-io, pypi, chocolatey and homebrew environments, each allowing
# `release-*` tags) is in docs/install.md, "For maintainers".
#
# Third-party actions in release-kit's jobs are pinned to commits (the version is in the
# comment).
name: release

on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (release-X.Y.Z) to run again
        required: true
      verify_only:
        description: >-
          Verify only: every package is already published (a run that failed
          after uploading); check them again and upload nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One release at a time; never cancel one that may be half published.
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      release: ${{ steps.gate.outputs.release }}
      selection: ${{ steps.gate.outputs.selection }}
      verify-only: ${{ steps.gate.outputs.verify-only }}
      github: ${{ steps.gate.outputs.github }}
      crates-io: ${{ steps.gate.outputs.crates-io }}
      pypi: ${{ steps.gate.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: gate
        uses: ./.github/release-kit/gate
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          verify-only: ${{ inputs.verify_only == true }}

  # The repository's own CI on the tagged commit: ci.yml needs
  # `on: workflow_call` with a `ref` input it checks out. (Rename `ref` here
  # if your ci.yml calls it something else.)
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  # Builds what release-kit.yml's `artifacts` declare, for the packages due,
  # from the tagged commit: one job per artifact and target, each running the
  # artifact's `test` (if any) on what it built. Skipped in a verify-only run.
  build:
    needs: [gate, ci]
    if: needs.gate.outputs.verify-only != 'true'
    uses: ./.github/workflows/release-kit-build.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
      selection: ${{ needs.gate.outputs.selection }}

  publish-github:
    needs: [gate, ci, build]
    # After a successful build; in a verify-only run, after CI (build skipped).
    if: >-
      !cancelled() && needs.gate.outputs.github == 'true' && needs.ci.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.gate.outputs.verify-only == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only used by a package with `attest: true` (its build provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - if: needs.gate.outputs.verify-only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release--*
          path: dist
      - uses: ./.github/release-kit/publish-github
        with:
          selection: ${{ needs.gate.outputs.selection }}
          verify-only: ${{ needs.gate.outputs.verify-only }}

  # crates.io publishes from source. Crates already on crates.io upload with
  # Trusted Publishing; a crate's first version cannot (crates.io offers it
  # only for an existing crate), so it uploads with the environment's
  # CARGO_REGISTRY_TOKEN secret, which reaches the step only when the
  # preflight found a new crate. Add each new crate's Trusted Publisher once
  # it is up.
  publish-crates:
    # From source, but after the build: a release whose artifacts fail to
    # build (or fail their tests) publishes nothing anywhere.
    needs: [gate, ci, build]
    if: >-
      !cancelled() && needs.gate.outputs.crates-io == 'true' && needs.ci.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.gate.outputs.verify-only == 'true'))
    runs-on: ubuntu-latest
    environment: crates-io          # the Trusted Publisher is bound to it
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      # Refuses a version already out, and says which crates are new.
      - id: preflight
        if: needs.gate.outputs.verify-only != 'true'
        env:
          SELECTION: ${{ needs.gate.outputs.selection }}
        run: python3 .github/release-kit/scripts/release.py preflight --registry crates.io --selection "$SELECTION"
      - id: auth
        if: steps.preflight.outputs.existing_crate == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - uses: ./.github/release-kit/publish-crates
        with:
          selection: ${{ needs.gate.outputs.selection }}
          new-crates: ${{ steps.preflight.outputs.new_crates || '[]' }}
          token: ${{ steps.auth.outputs.token }}
          new-crate-token: ${{ steps.preflight.outputs.new_crate == 'true' && secrets.CARGO_REGISTRY_TOKEN || '' }}
          verify-only: ${{ needs.gate.outputs.verify-only }}

  publish-pypi:
    needs: [gate, ci, build]
    if: >-
      !cancelled() && needs.gate.outputs.pypi == 'true' && needs.ci.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.gate.outputs.verify-only == 'true'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - if: needs.gate.outputs.verify-only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release--*
          path: dist
      - uses: ./.github/release-kit/publish-pypi
        with:
          selection: ${{ needs.gate.outputs.selection }}
          verify-only: ${{ needs.gate.outputs.verify-only }}

  # The Homebrew formula, rendered from the release's SHA256SUMS: attested and attached to
  # the release, then a pull request on buchochelliq-labs/homebrew-tap, with the
  # HOMEBREW_TAP_TOKEN secret of the `homebrew` environment. Without the secret it only
  # says so: the formula is on the release, to copy by hand. Prereleases leave it alone.
  publish-homebrew:
    needs: [gate, publish-github]
    if: >-
      !cancelled() && needs.publish-github.result == 'success'
      && needs.gate.outputs.verify-only != 'true' && !contains(needs.gate.outputs.release, '-')
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.release }}
      TAP: buchochelliq-labs/homebrew-tap
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          path: ods
      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "v$VERSION" --pattern SHA256SUMS --dir dist
          python3 ods/scripts/render-homebrew-formula.py --self-test
          python3 ods/scripts/render-homebrew-formula.py --version "$VERSION" --sums dist/SHA256SUMS > dist/ods.rb
          ruby -c dist/ods.rb
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ods.rb
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/ods.rb --clobber
      - id: token
        name: Check for the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN in the homebrew environment, so the tap isn't updated. Copy the release's ods.rb to $TAP's Formula/ods.rb, or set the token up (docs/install.md, \"For maintainers\")."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Open the tap's pull request
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ods/scripts/update-homebrew-tap.sh --tap tap --formula dist/ods.rb --version "$VERSION" --repo "$TAP"

  # Packs, installs and pushes the Chocolatey package, which downloads the release's
  # Windows archive: the CHOCOLATEY_API_KEY secret of the `chocolatey` environment.
  publish-chocolatey:
    needs: [gate, publish-github]
    if: >-
      !cancelled() && needs.publish-github.result == 'success'
      && needs.gate.outputs.verify-only != 'true'
    uses: ./.github/workflows/chocolatey.yml
    with:
      version: ${{ needs.gate.outputs.release }}
      publish: true
    secrets: inherit
