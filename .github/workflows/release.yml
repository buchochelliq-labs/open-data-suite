# Releases ODS (ADR-0019) with rab, the Release Asset Bundle
# (https://github.com/buchochelliq-labs/release-asset-bundle): what is published, and
# where, is rab.yml. Everything under .github/rab/ and rab-build.yml is the installed
# kit; this file is ODS's own, rab's template without the npm and VS Code jobs.
#
# `python3 .github/rab/scripts/release.py tag` on main pushes the tags; the
# `release-X.Y.Z` tag starts this run. It checks the tag once, runs CI once on the tagged
# commit, builds the archives and wheels (each tested where its runner can run it), and
# publishes what isn't published yet:
# - the crates on crates.io;
# - the GitHub release on vX.Y.Z: archives, SHA256SUMS, provenance attestations, and
#   the version's CHANGELOG section as notes;
# - the wheels on PyPI;
# - then, from the GitHub release, the Homebrew formula (attached to the release, and a
#   pull request on the tap) and the Chocolatey package (installed on Windows, then pushed);
# - and last, the release record (the `release-record` artifact): what was published.
#
# A release whose GitHub release is out but whose Homebrew or Chocolatey isn't done is
# finished by running `release.py tag` again.
#
# Admin setup (the crates-io, pypi, chocolatey and homebrew environments, each allowing
# `release-*` tags) is in docs/install.md, "For maintainers".
#
# Third-party actions in rab's jobs are pinned to commits (the version is in the
# comment).
name: release

on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (release-X.Y.Z) to run again
        required: true
      verify_only:
        description: >-
          Verify only: every package is already published (a run that failed
          after uploading); check them again and upload nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One release at a time; never cancel one that may be half published.
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      release: ${{ steps.gate.outputs.release }}
      selection: ${{ steps.gate.outputs.selection }}
      verify-only: ${{ steps.gate.outputs.verify-only }}
      github: ${{ steps.gate.outputs.github }}
      crates-io: ${{ steps.gate.outputs.crates-io }}
      pypi: ${{ steps.gate.outputs.pypi }}
      homebrew: ${{ steps.gate.outputs.homebrew }}
      chocolatey: ${{ steps.gate.outputs.chocolatey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: gate
        uses: ./.github/rab/gate
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          verify-only: ${{ inputs.verify_only == true }}

  # The repository's own CI on the tagged commit: ci.yml needs
  # `on: workflow_call` with a `ref` input it checks out. (Rename `ref` here
  # if your ci.yml calls it something else.)
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  # Builds what rab.yml's `artifacts` declare, for the packages due,
  # from the tagged commit: one job per artifact and target, each running the
  # artifact's `test` (if any) on what it built. Skipped in a verify-only run.
  build:
    needs: [gate, ci]
    if: needs.gate.outputs.verify-only != 'true'
    permissions:
      contents: read
      actions: read   # a ci-artifact reads this repository's CI artifacts
    uses: ./.github/workflows/rab-build.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
      selection: ${{ needs.gate.outputs.selection }}

  publish-github:
    needs: [gate, ci, build]
    # After a successful build; in a verify-only run, after CI (build skipped).
    if: >-
      !cancelled() && needs.gate.outputs.github == 'true' && needs.ci.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.gate.outputs.verify-only == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only used by a package with `attest: true` (its build provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - if: needs.gate.outputs.verify-only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release--*
          path: dist
      - uses: ./.github/rab/publish-github
        with:
          selection: ${{ needs.gate.outputs.selection }}
          verify-only: ${{ needs.gate.outputs.verify-only }}

  # From the GitHub release, once it is out: a github package's `homebrew`
  # formula, attached to the release and proposed to the tap with the
  # environment's HOMEBREW_TAP_TOKEN (without it, only a notice).
  # It also runs alone, when the gate selected a published release only to
  # finish its formula (publish-github is then skipped: nothing to upload).
  publish-homebrew:
    needs: [gate, ci, build, publish-github]
    if: >-
      !cancelled() && needs.gate.outputs.homebrew == 'true' && needs.gate.outputs.verify-only != 'true'
      && (needs.publish-github.result == 'success'
          || (needs.publish-github.result == 'skipped' && needs.gate.outputs.github != 'true'
              && needs.ci.result == 'success' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - uses: ./.github/rab/publish-homebrew
        with:
          selection: ${{ needs.gate.outputs.selection }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # A github package's `chocolatey` package, installed from the release on
  # Windows and pushed with the environment's CHOCOLATEY_API_KEY.
  # Like publish-homebrew, it also runs alone to finish a published release.
  publish-chocolatey:
    needs: [gate, ci, build, publish-github]
    if: >-
      !cancelled() && needs.gate.outputs.chocolatey == 'true' && needs.gate.outputs.verify-only != 'true'
      && (needs.publish-github.result == 'success'
          || (needs.publish-github.result == 'skipped' && needs.gate.outputs.github != 'true'
              && needs.ci.result == 'success' && needs.build.result == 'success'))
    runs-on: windows-latest
    environment: chocolatey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - uses: ./.github/rab/publish-chocolatey
        with:
          selection: ${{ needs.gate.outputs.selection }}
          api-key: ${{ secrets.CHOCOLATEY_API_KEY }}

  # crates.io publishes from source. Crates already on crates.io upload with
  # Trusted Publishing; a crate's first version cannot (crates.io offers it
  # only for an existing crate), so it uploads with the environment's
  # CARGO_REGISTRY_TOKEN secret, which reaches the step only when the
  # preflight found a new crate. Add each new crate's Trusted Publisher once
  # it is up.
  publish-crates:
    # From source, but after the build: a release whose artifacts fail to
    # build (or fail their tests) publishes nothing anywhere.
    needs: [gate, ci, build]
    if: >-
      !cancelled() && needs.gate.outputs.crates-io == 'true' && needs.ci.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.gate.outputs.verify-only == 'true'))
    runs-on: ubuntu-latest
    environment: crates-io          # the Trusted Publisher is bound to it
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      # Refuses a version already out, and says which crates are new.
      - id: preflight
        if: needs.gate.outputs.verify-only != 'true'
        env:
          SELECTION: ${{ needs.gate.outputs.selection }}
        run: python3 .github/rab/scripts/release.py preflight --registry crates.io --selection "$SELECTION"
      - id: auth
        if: steps.preflight.outputs.existing_crate == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - uses: ./.github/rab/publish-crates
        with:
          selection: ${{ needs.gate.outputs.selection }}
          new-crates: ${{ steps.preflight.outputs.new_crates || '[]' }}
          token: ${{ steps.auth.outputs.token }}
          new-crate-token: ${{ steps.preflight.outputs.new_crate == 'true' && secrets.CARGO_REGISTRY_TOKEN || '' }}
          verify-only: ${{ needs.gate.outputs.verify-only }}

  publish-pypi:
    needs: [gate, ci, build]
    if: >-
      !cancelled() && needs.gate.outputs.pypi == 'true' && needs.ci.result == 'success'
      && (needs.build.result == 'success'
          || (needs.build.result == 'skipped' && needs.gate.outputs.verify-only == 'true'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - if: needs.gate.outputs.verify-only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release--*
          path: dist
      - uses: ./.github/rab/publish-pypi
        with:
          selection: ${{ needs.gate.outputs.selection }}
          verify-only: ${{ needs.gate.outputs.verify-only }}

  record:
    needs: [gate, ci, build, publish-github, publish-homebrew, publish-chocolatey, publish-crates,
            publish-pypi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # As in the build workflow: the release tag must still name the commit
      # the gate checked before anything from the checkout runs. (When the
      # gate failed there is no such commit; the record then says so.)
      - name: Check the tag still names the gated commit
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          at=$(git rev-parse HEAD)
          if [ -n "$SHA" ] && [ "$at" != "$SHA" ]; then
            echo "::error::$TAG is at $at, not $SHA, the commit the gate checked; no record is written"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      # The files each package was built into, for their SHA-256.
      - if: needs.build.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release--*
          path: dist
      - env:
          # Reads a private repository's GitHub releases (contents: read).
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
          SELECTION: ${{ needs.gate.outputs.selection }}
          VERIFY_ONLY: ${{ needs.gate.outputs.verify-only }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 .github/rab/scripts/release.py record --tag "$TAG" --sha "$SHA"
          --selection "$SELECTION" --verify-only "$VERIFY_ONLY" --needs "$NEEDS" --out release-record.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: release-record.json
          if-no-files-found: error
