name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: python3 scripts/check-layering.py
      - run: python3 scripts/check-vendor-neutral.py --self-test
      - run: python3 scripts/check-vendor-neutral.py
      - run: python3 scripts/changelog-section.py --self-test
      - name: Validate repo metadata
        run: |
          jq empty .github/*.json
          bash -n scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The tests that check ODS against real dbt with DuckDB (#233): exact selection, test
  # accounting, dbt-shaped commands, the environment dbt reads, and more. They skip
  # unless ODS_TEST_DBT names a dbt executable. Each supported dbt minor is pinned, with
  # all its dependencies, in .github/dbt/requirements-<minor>.txt; bump them there.
  real-dbt:
    name: real-dbt (dbt ${{ matrix.dbt }})
    strategy:
      fail-fast: false
      matrix:
        dbt: ["1.11", "1.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: Cache the dbt virtualenv
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/dbt-venv
          key: dbt-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles(format('.github/dbt/requirements-{0}.txt', matrix.dbt)) }}
      - name: Install dbt ${{ matrix.dbt }} and dbt-duckdb
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/dbt-venv
          # Exactly the pinned packages: nothing resolved at install time.
          ~/dbt-venv/bin/pip install --no-deps -r .github/dbt/requirements-${{ matrix.dbt }}.txt
          ~/dbt-venv/bin/pip check
      - run: echo "ODS_TEST_DBT=$HOME/dbt-venv/bin/dbt" >> "$GITHUB_ENV"
      - run: '"$ODS_TEST_DBT" --version'
      # A filter that matches nothing passes, so check that the tests ran.
      - name: Real-dbt tests
        shell: bash
        run: |
          cargo test -p ods-cli --test state_run real_dbt 2>&1 | tee real-dbt.log
          grep -q '^test real_dbt \.\.\. ok' real-dbt.log
      # dbt's own --defer --favor-state and retry behaviour, which ADR-0020 relies on,
      # and the fix: `ods state export`, then `dbt retry --defer-state` (#296). All four
      # must run: a skipped test also passes, so --nocapture shows the skip message and
      # the job fails on it.
      - name: dbt favor-state and retry behaviour (#296)
        shell: bash
        run: |
          cargo test -p ods-cli --test dbt_favor_state -- --nocapture 2>&1 | tee favor-state.log
          grep -q 'test result: ok. 4 passed' favor-state.log
          ! grep -q 'skipped: set ODS_TEST_DBT' favor-state.log
      # The relation probe's Jinja rendered by real dbt against DuckDB (ADR-0022): rows,
      # nulls, a missing relation, a view, an unconfirmed format. It must run, not skip.
      - name: The relation probe on real dbt (#17)
        shell: bash
        run: |
          cargo test -p ods-provider-dbt --test probe real_dbt -- --nocapture 2>&1 | tee probe.log
          grep -q 'test result: ok. 1 passed' probe.log
          ! grep -q 'skipped: set ODS_TEST_DBT' probe.log
      - name: dbt's settings are all classified (#227)
        shell: bash
        run: |
          cargo test -p ods-provider-dbt --test env_params 2>&1 | tee env-params.log
          grep -q '^test every_setting_the_installed_dbt_reads_is_classified \.\.\. ok' env-params.log

  # The docs' recordings can't drift from what `ods` prints (scripts/record-docs.sh,
  # scripts/record-dashboard.py): every terminal tape in docs/tapes/ runs again with the
  # fake dbt, and each screenshot's text (masked for run ids, times and durations) must
  # match the committed one; every dashboard tour's steps must find their elements and
  # its stills' text must match. Offline apart from installing the tools.
  docs-media:
    runs-on: ubuntu-latest
    env:
      RICH_VERSION: 0.0.13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the rich CLI (rs-rich-cli)
        id: rich-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/rich
          key: rs-rich-cli-${{ env.RICH_VERSION }}-${{ runner.os }}
      - name: Install the rich CLI
        if: steps.rich-cache.outputs.cache-hit != 'true'
        run: cargo install rs-rich-cli --version "$RICH_VERSION" --locked --root ~/.local/rich
      - name: Terminal recordings match `ods`
        run: |
          export PATH="$HOME/.local/rich/bin:$PATH"
          scripts/record-docs.sh --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-record.txt
      - name: Install Playwright and Chromium
        run: |
          pip install -r scripts/requirements-record.txt
          python -m playwright install --with-deps chromium
      - name: Dashboard tours match `ods serve`
        run: python scripts/record-dashboard.py --check
      # The live run view (#322) in Chromium, against a simulated run: follow mode,
      # scopes, the node menu from the keyboard, reduced motion.
      - name: Live run view in a browser
        run: python crates/ods-web/tests/browser/live_view.py -v
      # The Impact simulator (#347) in Chromium: from a column, a change, the verdicts.
      - name: Impact simulator in a browser
        run: python crates/ods-web/tests/browser/impact.py -v

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      # `+1.90` overrides rust-toolchain.toml, which would otherwise select stable.
      - run: cargo +1.90 check --workspace --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
