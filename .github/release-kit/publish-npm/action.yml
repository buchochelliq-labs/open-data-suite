name: publish to npm
description: >-
  Publish the selected npm packages in release-kit.yml order, each from its
  manifest's directory, with provenance; then wait until npm serves them.
  Trusted Publishing needs `id-token: write` and npm 11.5 or later; without
  it, pass a token.
inputs:
  selection:
    description: The gate's selection output.
    required: true
  token:
    description: An npm automation token, when Trusted Publishing is not set up.
    default: ""
  verify-only:
    description: '"true" to skip the upload and only verify (a verify-only run).'
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SELECTION: ${{ inputs.selection }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        VERIFY_ONLY: ${{ inputs.verify-only }}
      run: |
        set -euo pipefail
        kit="$GITHUB_ACTION_PATH/../scripts/release.py"
        if [ "$VERIFY_ONLY" = true ]; then
          python3 "$kit" verify --registry npm --selection "$SELECTION"
          python3 "$kit" consume --registry npm --selection "$SELECTION"
          exit 0
        fi
        python3 "$kit" preflight --registry npm --selection "$SELECTION"
        if [ -n "$NODE_AUTH_TOKEN" ]; then
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
        fi
        jq -r '.[] | select(.registry == "npm") | .manifest' <<<"$SELECTION" | while read -r manifest; do
          ( cd "$(dirname "$manifest")" && npm publish --provenance --access public )
        done
        python3 "$kit" verify --registry npm --selection "$SELECTION"
        python3 "$kit" consume --registry npm --selection "$SELECTION"
