# Python packaging for the `ods` binary (#212).
#
# The wheel ships the compiled `ods` executable and nothing else: maturin's `bin`
# bindings put it in the environment's scripts directory, so `pip install opendatasuite`
# puts `ods` on PATH next to `dbt`, the way ruff and uv are distributed. There is no
# Python API. The version is the Cargo workspace version (ADR-0019).
#
# The distribution name `opendatasuite` is provisional.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "opendatasuite"
description = "OpenDataSuite (ODS): explainable, provider-neutral tooling for dbt projects. Installs the `ods` command."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# THIRD-PARTY-LICENSES.html is generated by cargo-about in the release workflow; a
# local build without it still succeeds (the glob matches nothing).
license-files = ["LICENSE", "THIRD-PARTY-LICENSES*.html"]
keywords = ["dbt", "analytics-engineering", "lineage", "data", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://buchochelliq-labs.github.io/open-data-suite/"
Documentation = "https://buchochelliq-labs.github.io/open-data-suite/install/"
Repository = "https://github.com/buchochelliq-labs/open-data-suite"
Changelog = "https://github.com/buchochelliq-labs/open-data-suite/blob/main/CHANGELOG.md"
Issues = "https://github.com/buchochelliq-labs/open-data-suite/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/ods-cli/Cargo.toml"
# Symbols stripped: smaller wheels; panics still print their message.
strip = true
