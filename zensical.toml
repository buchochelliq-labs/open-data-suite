[project.theme]
custom_dir = "overrides"
# System fonts: no requests to Google Fonts.
font = false
logo = "assets/brand/logo.svg"
favicon = "assets/brand/favicon.svg"
icon.repo = "fontawesome/brands/github"
features = [
  "announce.dismiss",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "toc.follow",
  "content.code.copy",
  "content.tabs.link",
  "search.highlight",
]

# The colours are set in assets/stylesheets/ods.css (`custom`).
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.extra]
generator = false
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/buchochelliq-labs/open-data-suite", name = "ODS on GitHub" },
  { icon = "fontawesome/brands/python", link = "https://pypi.org/project/opendatasuite/", name = "ODS on PyPI" },
]

[project.validation]
omitted_files = "warn"
absolute_links = "warn"
# The lineage demo (demo/lineage/) is generated into the built site, not docs/.
unrecognized_links = "info"
anchors = "warn"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
# Renders `\|` in table cells as `|`, as GitHub does (scripts/ods_markdown.py).
"scripts.ods_markdown" = {}
