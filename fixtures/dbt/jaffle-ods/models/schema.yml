version: 2
models:
  - name: customers
    description: One row per customer with order statistics.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: lifetime_value
        description: Sum of non-returned order amounts, in dollars.
  - name: orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
