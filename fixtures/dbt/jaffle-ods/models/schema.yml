version: 2
models:
  - name: customers
    description: One row per customer with order statistics.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: lifetime_value
        description: Sum of non-returned order amounts, in dollars.
  - name: orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id
  - name: customer_order_rank
    columns:
      - name: order_id
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
