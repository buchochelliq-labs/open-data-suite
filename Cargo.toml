[workspace]
resolver = "3"
members = ["crates/*", "providers/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Raised from 1.85 by ADR-0003: rs-rich requires 1.90.
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/buchochelliq-labs/open-data-suite"
publish = false

[workspace.dependencies]
# Internal crates
ods-core = { path = "crates/ods-core" }
ods-config = { path = "crates/ods-config" }
ods-sdk = { path = "crates/ods-sdk" }
ods-lineage = { path = "crates/ods-lineage" }
ods-web = { path = "crates/ods-web" }
ods-provider-dbt = { path = "providers/ods-provider-dbt" }
ods-provider-fake = { path = "providers/ods-provider-fake" }
ods-provider-sqlparser = { path = "providers/ods-provider-sqlparser" }

# Shared third-party crates (see ADR-0002)
anyhow = "1"
# HTTP server for the hostable explorer; confined to ods-web (ADR-0009).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
insta = "1"
# Reads dbt v2's Parquet "dbt Information Schema" (#12). Without Arrow; only the
# compression codecs dbt may use.
parquet = { version = "60", default-features = false, features = ["zstd", "snap", "lz4", "flate2-zlib-rs"] }
# Data parallelism for CPU-bound analysis (ADR-0008).
rayon = "1"
# Terminal rendering; only ods-cli may depend on it (ADR-0003, enforced by check-layering.py).
# `^0.0.x` pins the patch version, so every upgrade is a deliberate PR.
rs-rich = "0.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
# SQL parsing for column lineage (ADR-0008). Every 0.N release breaks the AST: pin and
# upgrade deliberately.
sqlparser = { version = "=0.63.0", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
