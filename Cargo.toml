[workspace]
resolver = "3"
# Add "providers/*" when the first provider crate lands (an empty glob fails to load).
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Raised from 1.85 by ADR-0003: rs-rich requires 1.90.
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/buchochelliq-labs/open-data-suite"
publish = false

[workspace.dependencies]
# Internal crates
ods-core = { path = "crates/ods-core" }
ods-sdk = { path = "crates/ods-sdk" }

# Shared third-party crates (see ADR-0002)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
insta = "1"
# Terminal rendering; only ods-cli may depend on it (ADR-0003, enforced by check-layering.py).
# `^0.0.x` pins the patch version, so every upgrade is a deliberate PR.
rs-rich = "0.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
