[workspace]
resolver = "3"
# Add "providers/*" when the first provider crate lands (an empty glob fails to load).
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/buchochelliq-labs/open-data-suite"
publish = false

[workspace.dependencies]
# Internal crates
ods-core = { path = "crates/ods-core" }
ods-sdk = { path = "crates/ods-sdk" }

# Shared third-party crates (see ADR-0002)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
