[package]
name = "ods-provider-process"
description = "Runs OpenDataSuite script checks and out-of-process plugins as processes, over the script protocol (ADR-0030 §4, ADR-0031 §5, §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
ods-core.workspace = true
ods-sdk.workspace = true
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }
tracing.workspace = true

[dev-dependencies]
ods-sdk = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros"] }

# The test binary is also the script it runs (`main` answers when asked to), so the
# tests need neither a shell nor an interpreter, on every platform.
[[test]]
name = "script"
harness = false

[[test]]
name = "plugin"
harness = false

[lints]
workspace = true
