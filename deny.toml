# cargo-deny configuration. Licence policy is provisional until #10 lands.
[graph]
all-features = true
# Check the platforms `ods` ships for (the CI matrix), not every target Rust knows.
# E.g. `parquet` pulls a CC0-licensed build-time RNG only on wasm32, which we don't ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # "Unmaintained" notice (no known vulnerability), pulled in only by syntect via
  # rs-rich. Accepted in ADR-0003; remove once rs-rich makes syntect optional
  # (ADR-0003 section 6, gap 1).
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained; via rs-rich -> syntect (ADR-0003)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. Anything else (copyleft, BUSL, unknown) needs an ADR.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
