site_name: OpenDataSuite (ODS)
site_description: >-
  An experimental, open-source, provider-neutral toolkit for analytics engineering:
  column-level lineage, impact analysis, ERDs and an MCP server for dbt projects.
site_url: https://buchochelliq-labs.github.io/open-data-suite/
repo_url: https://github.com/buchochelliq-labs/open-data-suite
repo_name: open-data-suite
edit_uri: edit/main/docs/
copyright: >-
  &copy; OpenDataSuite contributors &middot; Apache-2.0 &middot;
  <a href="https://buchochelliq-labs.github.io/open-data-suite/legal/">Legal and trademarks</a>

docs_dir: docs
# Working notes and competitive research are for contributors, not the public site.
exclude_docs: |
  research/
  design/*/boards/
  adr/0000-template.md
  tapes/
  assets/recordings/**/*.txt
  assets/recordings/**/provenance.json

theme:
  name: material
  custom_dir: overrides
  # System fonts: no requests to Google Fonts.
  font: false
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  # The colours are set in assets/stylesheets/ods.css (`custom`).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - assets/stylesheets/ods.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/buchochelliq-labs/open-data-suite
      name: ODS on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/opendatasuite/
      name: ODS on PyPI

# Renders `\|` in table cells as `|`, as GitHub does (scripts/mkdocs_hooks.py).
hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  # The lineage demo (demo/lineage/) is generated into the built site, not docs/.
  unrecognized_links: info
  anchors: warn

