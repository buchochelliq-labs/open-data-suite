[package]
name = "ods-health"
description = "The OpenDataSuite health engine: configurable checks, findings and badges (#392, ADR-0030)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ods-core.workspace = true
# `[health]` settings (ADR-0005): the engine validates the check ids they name.
ods-config.workspace = true
# The `health_check` contract the engine runs checks through (ADR-0030 §5).
ods-sdk.workspace = true
globset.workspace = true
serde.workspace = true
thiserror.workspace = true
# Each registered check runs under a timeout; past it, its findings are unknown.
tokio = { workspace = true, features = ["time"] }
# The health record (ADR-0030 §6): JSON, written whole then renamed into place.
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
tracing.workspace = true

[dev-dependencies]
ods-provider-fake.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "test-util"] }
proptest.workspace = true
toml.workspace = true

[lints]
workspace = true
