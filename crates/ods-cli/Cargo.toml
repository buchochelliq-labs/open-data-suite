[package]
name = "ods-cli"
description = "The `ods` command-line interface for OpenDataSuite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ods"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
clap_complete.workspace = true
# A plugin's trust digest (ADR-0030 §4b), and its `timeout`.
hex.workspace = true
humantime.workspace = true
ods-config.workspace = true
# `[health]` settings for the dashboard's badges (#392).
ods-health.workspace = true
ods-core.workspace = true
ods-erd.workspace = true
ods-lineage.workspace = true
ods-mcp.workspace = true
ods-provider-databricks.workspace = true
ods-provider-duckdb.workspace = true
ods-provider-dbt.workspace = true
# Runs script checks and out-of-process plugins as processes (ADR-0031 §5, §6).
ods-provider-process.workspace = true
ods-provider-sqlparser.workspace = true
# `ods plugin test` runs the SDK's suites against a plugin (ADR-0031 §5).
ods-sdk = { workspace = true, features = ["conformance"] }
ods-state.workspace = true
ods-store-sqlite.workspace = true
ods-web.workspace = true
opener.workspace = true
petgraph.workspace = true
rs-rich.workspace = true
supports-hyperlinks.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
ods-provider-fake.workspace = true
serde_json.workspace = true

# Its binary is also the script it checks with (`--ods-script-fixture`), so it has its
# own `main`.
[[test]]
name = "health_scripts"
harness = false

# Likewise, its binary is the out-of-process plugin it tests (`--ods-plugin-fixture`).
[[test]]
name = "plugin_process"
harness = false

# And here, the out-of-process warehouse plugin it tests (`--ods-warehouse-fixture`).
[[test]]
name = "plugin_warehouse"
harness = false

[lints]
workspace = true

# `cargo binstall --git https://github.com/buchochelliq-labs/open-data-suite ods-cli`
# downloads the release archive instead of compiling (#212). The names match
# .github/workflows/release.yml: `ods-v<version>-<target>.tar.gz` (`.zip` on Windows),
# with the binary in a directory of the same name. On Linux, binstall falls back from
# the gnu target to the static musl archives that are published.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ods-v{ version }-{ target }{ archive-suffix }"
bin-dir = "ods-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
