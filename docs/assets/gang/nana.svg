<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 240" role="img" aria-labelledby="t">
  <title id="t">Nana, a purple elephant in a polka-dot dress, dancing the jive</title>
  <!-- Nana: Tui's nana. Never misses a dance; she jives to anything with a beat. -->
  <ellipse cx="118" cy="226" rx="88" ry="8" fill="#000" opacity=".08"/>
  <!-- music notes -->
  <g fill="#14b8a6">
    <path d="M22 40 v-22 l16 -4 v22" fill="none" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="19" cy="41" r="5"/><circle cx="35" cy="37" r="5"/>
    <path d="M236 30 v-20" stroke="#14b8a6" stroke-width="3"/><circle cx="232" cy="31" r="5"/>
  </g>
  <path d="M46 116 q-18 -2 -24 -18" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <circle cx="22" cy="96" r="5" fill="#4c1d95"/>
  <!-- back leg kicked out: the jive -->
  <rect x="34" y="148" width="26" height="56" rx="12" fill="#7c3aed" transform="rotate(38 47 150)"/>
  <rect x="122" y="152" width="26" height="62" rx="12" fill="#7c3aed"/>
  <ellipse cx="108" cy="124" rx="70" ry="50" fill="#8b5cf6"/>
  <!-- polka-dot dress -->
  <path d="M46 108 q62 -22 124 0 l14 56 q-76 22 -152 0 z" fill="#ec4899"/>
  <g fill="#fdf2f8"><circle cx="70" cy="122" r="4"/><circle cx="96" cy="134" r="4"/><circle cx="122" cy="118" r="4"/>
  <circle cx="148" cy="134" r="4"/><circle cx="84" cy="150" r="4"/><circle cx="114" cy="152" r="4"/><circle cx="160" cy="154" r="4"/><circle cx="58" cy="148" r="4"/></g>
  <rect x="84" y="158" width="26" height="58" rx="12" fill="#8b5cf6"/>
  <rect x="148" y="156" width="26" height="60" rx="12" fill="#8b5cf6"/>
  <g fill="#ede9fe"><rect x="88" y="208" width="7" height="5" rx="2"/><rect x="99" y="208" width="7" height="5" rx="2"/>
  <rect x="152" y="208" width="7" height="5" rx="2"/><rect x="163" y="208" width="7" height="5" rx="2"/></g>
  <circle cx="186" cy="86" r="42" fill="#8b5cf6"/>
  <!-- trunk up high, swinging -->
  <path d="M218 98 q26 -4 24 -30 q-2 -20 14 -28" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
  <path d="M172 56 q-46 -6 -46 36 q0 40 40 40 q20 0 22 -24 z" fill="#a78bfa"/>
  <path d="M168 68 q-30 -2 -30 26 q0 26 26 26 q12 0 14 -14 z" fill="#ddd6fe"/>
  <!-- a flower behind her ear -->
  <g transform="translate(158 52)" fill="#facc15"><circle cx="0" cy="-7" r="5"/><circle cx="7" cy="0" r="5"/><circle cx="0" cy="7" r="5"/><circle cx="-7" cy="0" r="5"/><circle r="4" fill="#f97316"/></g>
  <!-- pearls -->
  <g fill="#fff" stroke="#e9d5ff" stroke-width="1"><circle cx="164" cy="122" r="3.5"/><circle cx="172" cy="126" r="3.5"/><circle cx="180" cy="128" r="3.5"/><circle cx="188" cy="127" r="3.5"/><circle cx="196" cy="124" r="3.5"/></g>
  <!-- eyes closed, enjoying the music -->
  <path d="M194 78 q6 5 12 0" fill="none" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>
  <circle cx="210" cy="96" r="6" fill="#f472b6" opacity=".5"/>
  <path d="M198 106 q8 8 16 2" fill="none" stroke="#2e1065" stroke-width="2.5" stroke-linecap="round"/>
</svg>
