# Home → Runs → a partial run's Nodes tab, with the failed node explained (#323) and its
# redacted error one click away.
title = "Runs: from Home to a failed node"
theme = "light"

[[step]]
goto = "/"
caption = "Home: the project's health, the recent runs, what needs attention"
expect = ["Project health", "Recent runs", "Needs attention"]
pause = 3800
still = "home"

[[step]]
click = "a:has-text('All runs')"
caption = "Runs: every recorded run, with its outcome, rows and duration from its journal"
expect = ["Partial"]
pause = 3800
still = "runs"

[[step]]
click = "tr.partial a.st-runid"
caption = "A partial run: some nodes failed, the others were recorded"
expect = ["partial", "at least 100"]
pause = 3600

[[step]]
click = "a.st-tab:has-text('Nodes'), [role=tab]:has-text('Nodes'), a:has-text('Nodes')"
caption = "Each node's result, time taken, rows, thread and why it ran"
pause = 3000

[[step]]
click = "details.st-explain-said > summary >> nth=0"
caption = "The failed node, explained: what went wrong, how sure ODS is, what to try, and dbt's own words with values removed"
expect = ["known pattern", "What to try", "[value removed]"]
pause = 4500
still = "run-nodes"
